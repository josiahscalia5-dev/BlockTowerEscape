name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > build.log 2>&1
          code=$?
          tail -n 80 build.log
          echo "exit=$code" >> build.log
          exit $code

      - name: Publish APK + log to the apk-build branch
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BlockTowerEscape-debug.apk || true
          cp build.log out/build.log || true
          echo "${GITHUB_SHA}" > out/commit.txt
          cd out
          git init -q
          git checkout -q -b apk-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "APK build for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlockTowerEscape-debug-apk
          path: out/BlockTowerEscape-debug.apk

      - name: Publish preview release (download on your phone)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: Screen 4 preview build ${{ github.run_number }}
          body: Debug APK of Screen 4 (main gameplay). Install on Android 7.0+ (allow installing from unknown sources).
          files: out/BlockTowerEscape-debug.apk
          make_latest: true
